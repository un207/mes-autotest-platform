# 测试环境配置。
# 口令等敏感项支持环境变量覆盖（见 common/config_loader.py），此处默认值仅为本地开箱运行，
# 与 mes-platform 的 application-dev.yml 保持一致 —— 本地 MySQL 就是 root/123456。

api:
  base_url: http://127.0.0.1:8080
  timeout: 10
  # 打印每个请求与响应，排查失败用例时按需打开
  verbose: false

db:
  host: 127.0.0.1
  port: 3306
  user: root
  password: "123456"
  # 落库校验连测试库，与业务库物理隔离；跑用例时 MES 服务也应切到 test profile
  database: mes_test
  charset: utf8mb4
  connect_timeout: 5

run:
  # 每轮用例生成的单号前缀，用于标识「本轮造的数据」，便于清理与排查
  data_prefix: M2
  # 用例结束后是否自动清理本轮造数；排障时可临时置 false 保留现场
  cleanup: true
